name: Sync Facebook Post
on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:      # Allows you to click a button to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Latest Post from Facebook
        run: |
          # Fetch data
          RESPONSE=$(curl -s "https://graph.facebook.com/v24.0/${{ secrets.FB_PAGE_ID }}/feed?limit=1&access_token=${{ secrets.FB_TOKEN }}")
          
          # Use jq to get the message and escape it for sed
          MESSAGE=$(echo $RESPONSE | jq -r '.data[0].message // "Check our Facebook for the latest update!"')
          
          # Clean up the message to remove characters that break the script
          CLEAN_MESSAGE=$(echo "$MESSAGE" | tr -d '\n' | sed 's/[&/]/\\&/g')

          # Replace the placeholder using | as a separator instead of /
          sed -i "s|{{FB_POST}}|$CLEAN_MESSAGE|g" index.html

      - name: Commit and Push changes
        run: |
          git config --global user.name "FB-Update-Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Auto-update: Latest Facebook post" || echo "No changes to commit"
          git push
