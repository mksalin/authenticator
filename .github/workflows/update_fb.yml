name: Sync Facebook Post
on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:      # Allows you to click a button to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Latest Post from Facebook
        run: |
          # 1. Fetch data from Facebook API
          # We use 'jq' to extract the 'message' field from the first item in the feed
          RESPONSE=$(curl -s "https://graph.facebook.com/v24.0/${{ secrets.FB_PAGE_ID }}/feed?limit=1&access_token=${{ secrets.FB_TOKEN }}")
          MESSAGE=$(echo $RESPONSE | jq -r '.data[0].message')
          
          # 2. If message is empty (e.g. only a photo), get the created_time or a fallback
          if [ "$MESSAGE" == "null" ]; then MESSAGE="New photo posted! Check it out on Facebook."; fi

          # 3. Replace the placeholder in index.html
          # We use a temp file to avoid issues with sed
          sed "s/{{FB_POST}}/$MESSAGE/g" index.html > temp.html && mv temp.html index.html

      - name: Commit and Push changes
        run: |
          git config --global user.name "FB-Update-Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Auto-update: Latest Facebook post" || echo "No changes to commit"
          git push
